<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4590"/><stop offset="1" stop-color="#141a40"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a66"/><stop offset="1" stop-color="#5b7fd6"/></linearGradient>
    <radialGradient id="mglow" cx="50%" cy="50%" r="50%"><stop offset="0.5" stop-color="#fff2c0" stop-opacity="0.45"/><stop offset="1" stop-color="#fff2c0" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c0" stop-opacity="0.25"/><stop offset="1" stop-color="#fff2c0" stop-opacity="0"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <radialGradient id="halo" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#8fa6ec" stop-opacity="0.6"/><stop offset="1" stop-color="#8fa6ec" stop-opacity="0"/></radialGradient>
    <clipPath id="inner"><rect x="48" y="48" width="904" height="904" rx="40"/></clipPath>
    <clipPath id="win"><path d="M360 760 L360 300 C360 190 460 130 620 130 C780 130 880 190 880 300 L880 760 Z"/></clipPath>
  </defs>
  <rect width="1000" height="1000" rx="90" fill="#141010"/>
  <g clip-path="url(#inner)">
    <rect x="48" y="48" width="904" height="904" fill="url(#wall)"/>
    <!-- the night outside the window -->
    <g clip-path="url(#win)">
      <rect x="360" y="120" width="520" height="650" fill="url(#sky)"/>
      <g fill="#fff2c0"><circle cx="440" cy="240" r="3"/><circle cx="520" cy="180" r="2.5"/><circle cx="820" cy="420" r="3"/><circle cx="460" cy="400" r="2.5"/><circle cx="600" cy="360" r="2"/></g>
      <circle cx="720" cy="300" r="150" fill="url(#mglow)"/>
      <circle cx="720" cy="300" r="95" fill="#f6e7a2"/>
      <g fill="#e2cf85" opacity="0.6"><circle cx="690" cy="280" r="16"/><circle cx="750" cy="330" r="10"/></g>
      <!-- far pines -->
      <path fill="#26346e" d="M360 760 L360 640 L390 580 L420 640 L440 600 L470 660 L500 590 L530 660 L560 610 L590 670 L620 600 L650 660 L690 590 L720 660 L760 610 L790 670 L820 600 L850 650 L880 610 L880 760 Z"/>
      <!-- prowling wolf -->
      <g fill="#080a20" transform="translate(520 612) scale(1.1)">
        <path d="M0 30 L30 22 L40 0 L52 20 C70 25 90 30 120 32 C150 30 175 38 190 50 L215 40 C205 60 195 70 185 72 L180 110 L168 110 L165 78 C140 82 110 82 85 80 L80 110 L68 110 L62 76 C50 70 45 60 40 50 C30 48 15 44 0 38 Z"/>
        <path d="M150 78 L152 110 L162 110 L160 78 Z M92 80 L96 110 L106 110 L102 80 Z"/>
      </g>
      <circle cx="560" cy="644" r="4" fill="#f2c94c"/>
      <rect x="360" y="732" width="520" height="40" fill="#080a20"/>
      <!-- glowing eyes in the trees -->
      <g fill="#f2c94c"><ellipse cx="820" cy="690" rx="7" ry="4"/><ellipse cx="840" cy="690" rx="7" ry="4"/></g>
    </g>
    <!-- window frame -->
    <path d="M360 760 L360 300 C360 190 460 130 620 130 C780 130 880 190 880 300 L880 760 Z" fill="none" stroke="#0e0f26" stroke-width="28"/>
    <path d="M620 130 V760 M360 440 H880" stroke="#0e0f26" stroke-width="16"/>
    <rect x="320" y="750" width="600" height="32" rx="6" fill="#0e0f26"/>
    <!-- curtain -->
    <path fill="#4a2a78" d="M880 90 C850 260 910 460 870 790 L952 790 L952 90 Z"/>
    <path d="M900 120 C890 300 920 500 900 780" fill="none" stroke="#2c1850" stroke-width="8"/>
    <!-- moonlight on the floor -->
    <path fill="url(#beam)" d="M360 782 L880 782 L952 952 L300 952 Z"/>
    <rect x="48" y="880" width="904" height="80" fill="#0b0d24" opacity="0.6"/>

    <!-- moonlight falling on the girl -->
    <ellipse cx="392" cy="760" rx="170" ry="220" fill="url(#halo)"/>
    <!-- the little girl, peeking -->
    <g fill="#07081a">
      <path d="M360 615 C335 630 330 670 345 700 L330 760 C325 775 345 780 350 765 L362 705 Z"/>
      <circle cx="390" cy="650" r="46"/>
      <circle cx="436" cy="662" r="9"/>
      <rect x="376" y="688" width="26" height="22"/>
      <path d="M350 705 L420 705 C440 760 455 830 470 900 L300 900 C315 830 330 760 350 705 Z"/>
      <path d="M414 722 L470 756" stroke="#07081a" stroke-width="20" stroke-linecap="round"/>
      <circle cx="474" cy="752" r="13"/>
      <path d="M340 900 L332 916 L372 916 L368 900 Z M410 900 L408 916 L446 916 L440 900 Z"/>
    </g>
    <!-- hair bow and eye glint -->
    <path d="M326 752 L312 740 L314 770 Z M338 752 L352 740 L350 770 Z" fill="#e8432f"/>
    <circle cx="418" cy="644" r="5" fill="#fff2c0"/>
  </g>
  <rect x="48" y="48" width="904" height="904" rx="40" fill="#000" opacity="0.14" filter="url(#grain)"/>
</svg>
