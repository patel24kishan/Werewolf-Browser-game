<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="80%"><stop offset="0" stop-color="#fff4d2"/><stop offset="0.6" stop-color="#f0d590"/><stop offset="1" stop-color="#c99a4a"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="19"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <clipPath id="inner"><rect x="48" y="48" width="904" height="904" rx="40"/></clipPath>
    <path id="ray" d="M500 640 L452 -120 L548 -120 Z"/>
    <ellipse id="leaf" cx="0" cy="0" rx="28" ry="11"/>
  </defs>
  <rect width="1000" height="1000" rx="90" fill="#141010"/>
  <g clip-path="url(#inner)">
    <rect x="48" y="48" width="904" height="904" fill="url(#bg)"/>
    <!-- sunburst -->
    <g fill="#ffffff" opacity="0.28">
      <use href="#ray"/><use href="#ray" transform="rotate(30 500 640)"/><use href="#ray" transform="rotate(60 500 640)"/>
      <use href="#ray" transform="rotate(90 500 640)"/><use href="#ray" transform="rotate(120 500 640)"/><use href="#ray" transform="rotate(150 500 640)"/>
      <use href="#ray" transform="rotate(180 500 640)"/><use href="#ray" transform="rotate(210 500 640)"/><use href="#ray" transform="rotate(240 500 640)"/>
      <use href="#ray" transform="rotate(270 500 640)"/><use href="#ray" transform="rotate(300 500 640)"/><use href="#ray" transform="rotate(330 500 640)"/>
    </g>

    <!-- ribbon -->
    <g stroke="#141010" stroke-width="12" stroke-linejoin="round">
