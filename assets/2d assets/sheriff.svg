    <path d="M370 40 H500 V460 L370 380 Z" fill="#000" opacity="0.12"/>
    <!-- ring -->
    <circle cx="500" cy="452" r="26" fill="none" stroke="#141010" stroke-width="12"/>

    <!-- laurel wreath -->
    <g fill="none" stroke="#2c5a2a" stroke-width="9" stroke-linecap="round">
      <path d="M330 810 A 240 240 0 0 1 330 470"/>
      <path d="M670 810 A 240 240 0 0 0 670 470"/>
    </g>
    <g fill="#3f7d3a" stroke="#141010" stroke-width="5">
      <use href="#leaf" transform="translate(318 800) rotate(-20)"/><use href="#leaf" transform="translate(342 830) rotate(40)"/>
      <use href="#leaf" transform="translate(280 752) rotate(-40)"/><use href="#leaf" transform="translate(306 772) rotate(20)"/>
      <use href="#leaf" transform="translate(256 696) rotate(-60)"/><use href="#leaf" transform="translate(282 708) rotate(0)"/>
      <use href="#leaf" transform="translate(248 636) rotate(-80)"/><use href="#leaf" transform="translate(274 640) rotate(-20)"/>
      <use href="#leaf" transform="translate(256 574) rotate(-100)"/><use href="#leaf" transform="translate(282 576) rotate(-40)"/>
      <use href="#leaf" transform="translate(280 516) rotate(-120)"/><use href="#leaf" transform="translate(304 522) rotate(-60)"/>
      <use href="#leaf" transform="translate(318 466) rotate(-130)"/>
      <use href="#leaf" transform="translate(682 800) rotate(20)"/><use href="#leaf" transform="translate(658 830) rotate(-40)"/>
      <use href="#leaf" transform="translate(720 752) rotate(40)"/><use href="#leaf" transform="translate(694 772) rotate(-20)"/>
      <use href="#leaf" transform="translate(744 696) rotate(60)"/><use href="#leaf" transform="translate(718 708) rotate(0)"/>
      <use href="#leaf" transform="translate(752 636) rotate(80)"/><use href="#leaf" transform="translate(726 640) rotate(20)"/>
      <use href="#leaf" transform="translate(744 574) rotate(100)"/><use href="#leaf" transform="translate(718 576) rotate(40)"/>
      <use href="#leaf" transform="translate(720 516) rotate(120)"/><use href="#leaf" transform="translate(696 522) rotate(60)"/>
      <use href="#leaf" transform="translate(682 466) rotate(130)"/>
    </g>

    <!-- star badge with bevelled facets -->
    <path fill="#141010" d="M500 418 L556 566 L714 572 L590 670 L634 822 L500 734 L366 822 L410 670 L286 572 L444 566 Z"/>
    <g>
      <path fill="#fbe07a" d="M500 640 L500 440 L548 574 Z"/>
      <path fill="#d9a52a" d="M500 640 L500 440 L452 574 Z"/>
      <path fill="#fbe07a" d="M500 640 L690 578 L578 665 Z"/>
      <path fill="#d9a52a" d="M500 640 L690 578 L548 574 Z"/>
      <path fill="#fbe07a" d="M500 640 L618 802 L500 722 Z"/>
      <path fill="#d9a52a" d="M500 640 L618 802 L578 665 Z"/>
      <path fill="#fbe07a" d="M500 640 L382 802 L422 665 Z"/>
      <path fill="#d9a52a" d="M500 640 L382 802 L500 722 Z"/>
      <path fill="#fbe07a" d="M500 640 L310 578 L452 574 Z"/>
      <path fill="#d9a52a" d="M500 640 L310 578 L422 665 Z"/>
    </g>
    <!-- centre seal -->
    <circle cx="500" cy="640" r="74" fill="#e8432f" stroke="#141010" stroke-width="12"/>
    <circle cx="500" cy="640" r="50" fill="#6a3ea1"/>
    <path fill="#fbe07a" d="M516 606 c-30 0 -52 22 -52 50 c0 28 22 50 52 50 c-16 -12 -26 -30 -26 -50 c0 -20 10 -38 26 -50 z"/>
    <g fill="#fbe07a"><circle cx="530" cy="626" r="4"/><circle cx="540" cy="660" r="3"/></g>
    <!-- studs on star tips -->
    <g fill="#141010"><circle cx="500" cy="462" r="7"/><circle cx="668" cy="582" r="7"/><circle cx="606" cy="782" r="7"/><circle cx="394" cy="782" r="7"/><circle cx="332" cy="582" r="7"/></g>
  </g>
  <rect x="48" y="48" width="904" height="904" rx="40" fill="#000" opacity="0.1" filter="url(#grain)"/>
</svg>
