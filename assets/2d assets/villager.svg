      <circle cx="330" cy="560" r="34"/>
      <ellipse cx="330" cy="532" rx="54" ry="10"/>
      <rect x="305" y="498" width="50" height="36" rx="8"/>
      <rect x="320" y="588" width="20" height="16"/>
      <path d="M290 600 L370 600 C385 640 388 690 382 730 L372 800 L346 800 L340 735 L322 735 L314 800 L288 800 L280 730 C274 690 276 640 290 600 Z"/>
