<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a33a"/><stop offset="0.6" stop-color="#f9d76a"/><stop offset="1" stop-color="#f6c24a"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff7d6"/><stop offset="0.55" stop-color="#ffe58f"/><stop offset="1" stop-color="#ffe58f" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <clipPath id="inner"><rect x="48" y="48" width="904" height="904" rx="40"/></clipPath>
  </defs>
  <rect width="1000" height="1000" rx="90" fill="#141010"/>
